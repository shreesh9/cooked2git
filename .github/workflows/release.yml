name: Release Build Artifact

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Extension
        run: npm run build

      - name: Zip Build Output
        run: |
          cd dist
          zip -r ../cooked2git-extension.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cooked2git-extension.zip
          generate_release_notes: true
